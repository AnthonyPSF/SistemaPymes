<header class="topbar">
  <div class="brand">
    
  </div>
  <label class="theme-toggle" title="Cambiar tema">
    <input id="themeSwitch" type="checkbox" aria-label="Cambiar tema" />
    <span class="slider"></span>
  </label>
</header>

<main class="center">
  <section class="card" role="form" aria-labelledby="title">

  <header class="admn">
      <button class="btn outline" [class.active]="isLogin" (click)="switchForm(true)">Ingresar</button>
      <button class="btn outline" [class.active]="!isLogin"(click)="switchForm(false)">Registrarse</button>
  </header>
  
    <div *ngIf="isLogin; else signupTemplate"> 
      <h1 id="title">Inicia sesión</h1>
      <p class="muted">Bienvenido de vuelta. Ingresa tus credenciales.</p>
       <!-- ============ FORMULARIO LOGIN ============ -->
    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()" novalidate>
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" formControlName="email" type="email" placeholder="tú@correo.com" autocomplete="email" required />
        <small class="error" id="emailError"></small>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-affix">
            <input [type]="showPwd ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Introduce tu contraseña" required />
           <button type="button" class="icon-btn" (click)="togglepassword()">👁</button>
          </div>

        <div class="strength" aria-hidden="true">
          <div class="bar" id="bar1"></div>
          <div class="bar" id="bar2"></div>
          <div class="bar" id="bar3"></div>
          <div class="bar" id="bar4"></div>
        </div>
        <small class="error" id="passwordError"></small>
      </div>

      <div class="row">
        <label class="check">
          <input id="remember" type="checkbox" />
          <span>Recordarme</span>
        </label>
        <a class="link" href="#" id="forgot">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="alert" id="formAlert" role="status" aria-live="polite"></div>

      <button class="btn primary" id="submitBtn" type="submit">
        <span class="btn-label">Entrar</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <div class="divider"><span>o</span></div>
    </form>
    </div>

    <!-- ============ FORMULARIO SIGN UP ============ -->
    <ng-template #signupTemplate>
      <h1 id="title">Crear cuenta</h1>
      <p class="muted">Completa los campos para registrarte.</p>

      <form [formGroup]="signupForm" (ngSubmit)="submitSignup()" novalidate>
        <div class="field">
          <label for="name">Nombre completo</label>
          <input id="name" formControlName="name" type="text" placeholder="Tu nombre completo" required />
        </div>

        <div class="field">
          <label for="email">Correo</label>
          <input id="signupEmail" formControlName="email" type="email" placeholder="tú@correo.com" required />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-affix">
            <input [type]="showPwd ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Introduce tu contraseña" required />
           <button type="button" class="icon-btn" (click)="togglepassword()">👁</button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="input-affix">
            <input [type]="showPwd ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Repite tu contraseña" required />
           <button type="button" class="icon-btn" (click)="togglepassword()">👁</button>
          </div>
        </div>
        

        <div class="strength" aria-hidden="true">
          <div class="bar" id="bar1"></div>
          <div class="bar" id="bar2"></div>
          <div class="bar" id="bar3"></div>
          <div class="bar" id="bar4"></div>
        </div>

        <br>

        <button class="btn primary" type="submit">Registrarse</button>

      </form>
    </ng-template>
  </section>
  
</main>
